<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo/skg-logo.png" />
    <link rel="apple-touch-icon" href="/logo/skg-logo.png" />
    <title>SKG Admin CMS</title>
  </head>
  <body>
    <div id="root">
      <div
        role="status"
        aria-label="Loading admin"
        style="
          min-height: 100vh;
          display: grid;
          place-content: center;
          justify-items: center;
          gap: 24px;
          background: #f6f8fc;
        "
      >
        <img src="/logo/skg-logo.png" alt="SKG Travels" width="150" /><span
          style="
            width: 38px;
            height: 38px;
            border: 3px solid #dce8ee;
            border-top-color: #007681;
            border-radius: 50%;
            animation: boot-spin 0.8s linear infinite;
          "
        ></span>
      </div>
    </div>
    <style>
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root span {
          animation: none !important;
        }
      }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
